<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Chronos History Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#f4f1ea',
              'paper-dark': '#e6e2d6',
              ink: '#2b2622',
              'ink-light': '#4a443f',
              gold: '#c5a059',
              'gold-dark': '#8a6b32',
              'gold-light': '#e6c88a',
              sepia: '#5c4d3c',
              crimson: '#8a2c2c',
            },
            fontFamily: {
              sans: ['Lato', 'sans-serif'],
              serif: ['Merriweather', 'serif'],
              display: ['Cinzel', 'serif'],
              antique: ['"IM Fell English SC"', 'serif'],
            },
            backgroundImage: {
              'parchment': "url('https://www.transparenttextures.com/patterns/aged-paper.png')",
              'leather': "url('https://www.transparenttextures.com/patterns/black-leather.png')",
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f4f1ea;
        color: #2b2622;
        background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
      }
      /* Leaflet map container override */
      .leaflet-container {
        width: 100%;
        height: 100%;
        z-index: 10;
        background: #e6e2d6;
      }
      
      /* Fancy Borders */
      .border-double-archival {
        border: 4px double #e6c88a;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e6e2d6; 
      }
      ::-webkit-scrollbar-thumb {
        background: #8a6b32; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #5c4d3c; 
      }
    </style>

}
