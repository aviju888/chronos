<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e6c88a"/>
      <stop offset="50%" style="stop-color:#c5a059"/>
      <stop offset="100%" style="stop-color:#8a6b32"/>
    </linearGradient>
  </defs>
  <!-- Outer circle (clock face) -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <!-- Hour markers -->
  <g stroke="url(#goldGrad)" stroke-width="2">
    <line x1="50" y1="10" x2="50" y2="18"/>
    <line x1="50" y1="82" x2="50" y2="90"/>
    <line x1="10" y1="50" x2="18" y2="50"/>
    <line x1="82" y1="50" x2="90" y2="50"/>
  </g>
  <!-- Hour hand (pointing to past) -->
  <line x1="50" y1="50" x2="30" y2="35" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="65" y2="25" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="url(#goldGrad)"/>
  <!-- Decorative infinity/time loop at bottom -->
  <path d="M35 70 Q42 65 50 70 Q58 75 65 70" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
</svg>
